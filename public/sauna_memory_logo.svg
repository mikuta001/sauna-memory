  </defs>

  <!-- Editable text: font falls back to common cursive/script fonts -->
  <text x="185" y="410"
        fill="url(#textBlue)"
        font-family="Brush Script MT, Segoe Script, cursive"
        font-size="250"
        font-weight="700"
