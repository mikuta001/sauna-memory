<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="textBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f7fa8"/>
      <stop offset="100%" stop-color="#659bc0"/>
    </linearGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#75bde5"/>
      <stop offset="55%" stop-color="#9ed8f2"/>
      <stop offset="100%" stop-color="#66b8e5"/>
